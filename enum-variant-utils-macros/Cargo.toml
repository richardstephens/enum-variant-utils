[package]
name = "enum-variant-utils-macros"
version.workspace = true
edition = "2024"

[lib]
name = "enum_variant_utils_macros"
path = "src/lib.rs"
proc-macro = true

[dependencies]
convert_case = "0.8.0"
darling = "0.20.11"
itertools = "0.14"
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = "2.0.104"

[lints.clippy]
# Enable desired off-by-default lints
print_stdout = "deny"
print_stderr = "deny"
